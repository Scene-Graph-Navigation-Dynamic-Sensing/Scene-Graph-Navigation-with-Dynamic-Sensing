# Test 1: the group rule's drop (box > 30% of the image with >= 3 smaller detections inside) WITHOUT tightening
# boxes to masks: isolates whether tightening caused the embedding-quality loss of the alignment run.
detection:
  mask_box_filter: {enabled: true, min_box_frac: 0.3, min_fill: null, min_contained: 3}
  tighten_box_to_mask: false
